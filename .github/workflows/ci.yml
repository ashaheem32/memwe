name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memwe
          POSTGRES_PASSWORD: memwe
          POSTGRES_DB: memwe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memwe" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      # owner — migrations and worker (bypasses RLS)
      DATABASE_URL: postgres://memwe:memwe@localhost:5432/memwe
      # app role — created by migration 003, RLS enforced. The isolation
      # tests are meaningless without this pointing at the restricted role.
      APP_DATABASE_URL: postgres://memwe_app:memwe_app@localhost:5432/memwe
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose — `packageManager` in package.json is
      # the single source of truth. Specifying both is an error, not a
      # tiebreak (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm migrate
      - run: pnpm seed
      - run: pnpm test
        env:
          # The live prompt-cache assertion (tests/context-live.test.ts)
          # spends a few cents per run, so it runs only where the secret
          # exists. Fork PRs have no secrets and skip it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_LIVE_MODEL_TESTS: ${{ secrets.ANTHROPIC_API_KEY != '' && '1' || '' }}
