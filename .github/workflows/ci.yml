name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memwe
          POSTGRES_PASSWORD: memwe
          POSTGRES_DB: memwe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memwe" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://memwe:memwe@localhost:5432/memwe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm migrate
      - run: pnpm seed
      - run: pnpm test
