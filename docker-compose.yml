services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: memwe-pg
    environment:
      POSTGRES_USER: memwe
      POSTGRES_PASSWORD: memwe
      POSTGRES_DB: memwe
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memwe -d memwe"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: memwe-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: memwe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: memwe
      MINIO_ROOT_PASSWORD: memwedevsecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
